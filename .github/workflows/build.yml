name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      # On failure, surface the compiler errors as an annotation (readable from the run summary and the API).
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          msg=$( (grep -E "error:|warning: \[removal\]" -A2 build.log | grep -v "^--$" | sed -E 's#^/home/runner/work/[^/]+/[^/]+/src/main/java/##' || tail -60 build.log) | head -400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ -z "$msg" ]; then msg=$(tail -60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error title=Build errors::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: dominion-mod
          path: build/libs/*.jar
